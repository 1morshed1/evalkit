[project]
name = "evalkit-py"
version = "0.1.0"
description = "Evaluate LLM applications: retrieval quality, generation quality, and agent reliability."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "1morshed1" }]
keywords = ["llm", "evaluation", "rag", "retrieval", "faithfulness", "agent", "llm-as-judge"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
dev = ["pytest>=8.0", "ruff>=0.6", "pytest-asyncio>=0.23"]

[project.scripts]
evalkit = "evalkit.cli:main"

[project.urls]
Homepage = "https://github.com/1morshed1/evalkit"
Repository = "https://github.com/1morshed1/evalkit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
