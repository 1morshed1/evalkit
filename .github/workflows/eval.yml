name: RAG Evaluation

# Runs the EvalKit suite on every PR that touches the RAG code or the eval suite,
# and fails the build if quality drops below thresholds.
on:
  pull_request:
    paths:
      - "demo/**"
      - "evalkit/**"
      - "**/eval_suite*.yaml"
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install EvalKit
        run: pip install -e .

      - name: Start Ollama (local judge, no API keys)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          # wait for the server, then pull the judge model
          for i in $(seq 1 30); do curl -sf http://localhost:11434/ && break || sleep 2; done
          ollama pull llama3.2

      - name: Run evaluation suite (fail below thresholds)
        run: |
          evalkit run demo/eval_suite.yaml \
            --output results.json \
            --html report.html \
            --fail-below-thresholds

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            report.html
            results.json
